<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE885" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#B7791F" />
      <stop offset="100%" stop-color="#8C530A" />
    </linearGradient>

    <!-- Deep Carbon Metallic Background -->
    <radialGradient id="carbonBgL" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c1c1c" />
      <stop offset="70%" stop-color="#0d0d0d" />
      <stop offset="100%" stop-color="#050505" />
    </radialGradient>

    <!-- Inner Core Glow -->
    <radialGradient id="coreGlowL" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="goldShadowL" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#D4AF37" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Base Container -->
  <rect width="64" height="64" rx="16" fill="url(#carbonBgL)" stroke="url(#goldGradL)" stroke-width="1.5" />
  
  <!-- Subtle Core Glow -->
  <circle cx="32" cy="32" r="22" fill="url(#coreGlowL)" />

  <!-- Precision Mechanical 8-Tooth Gear -->
  <g filter="url(#goldShadowL)">
    <path
      d="M34.8 12h-5.6l-1 4.5a16 16 0 0 0-4.1 1.7l-4.2-2.2-4 4 2.2 4.2a16 16 0 0 0-1.7 4.1L12 29.2v5.6l4.5 1a16 16 0 0 0 1.7 4.1l-2.2 4.2 4 4 4.2-2.2a16 16 0 0 0 4.1 1.7l1 4.5h5.6l1-4.5a16 16 0 0 0 4.1-1.7l4.2 2.2 4-4-2.2-4.2a16 16 0 0 0 1.7-4.1l4.5-1v-5.6l-4.5-1a16 16 0 0 0-1.7-4.1l2.2-4.2-4-4-4.2 2.2a16 16 0 0 0-4.1-1.7l-1-4.5z"
      fill="url(#goldGradL)"
    />
    
    <!-- Central Hub Cutout -->
    <circle cx="32" cy="32" r="10" fill="#0d0d0d" stroke="url(#goldGradL)" stroke-width="2.5" />
    
    <!-- Central Core Electric/Mechanical Diamond Pin -->
    <polygon points="32,25 36,32 32,39 28,32" fill="url(#goldGradL)" />
    <circle cx="32" cy="32" r="2" fill="#FFE885" />
  </g>
</svg>
